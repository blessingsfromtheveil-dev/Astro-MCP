version: "3.9"

name: astro-mcp

services:
  astro-mcp:
    build:
      context: .
      dockerfile: Dockerfile

    image: astro-mcp:latest

    container_name: astro-mcp

    restart: unless-stopped

    env_file:
      - .env

    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/app/src"
      TZ: UTC

    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - ./ephemeris:/app/ephemeris

    ports:
      - "8000:8000"

    command: >
      uvicorn
      astro_mcp.api:app
      --host 0.0.0.0
      --port 8000
      --reload

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - astro-network

networks:
  astro-network:
    driver: bridge
