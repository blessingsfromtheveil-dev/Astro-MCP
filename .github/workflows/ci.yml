name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip wheel

      - name: Install package
        run: |
          pip install -e .[dev]

      - name: Ruff
        run: |
          ruff check .

      - name: Ruff Format Check
        run: |
          ruff format --check .

      - name: MyPy
        run: |
          mypy src

      - name: Pytest
        run: |
          pytest -v

      - name: Build Package
        run: |
          python -m build
