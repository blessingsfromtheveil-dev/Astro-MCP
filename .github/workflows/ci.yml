name: Astro-MCP CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip wheel setuptools

      - name: Install project
        run: |
          pip install -e .

      - name: Install dependencies
        run: |
          pip install \
            fastapi \
            fastmcp \
            uvicorn \
            pyswisseph \
            pytest \
            pytest-asyncio \
            ruff \
            mypy

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy src

      - name: Pytest
        run: pytest
