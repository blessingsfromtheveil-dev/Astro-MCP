name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: |
          python -m pip install --upgrade pip
          pip install build twine

      - run: |
          python -m build

      - run: |
          twine check dist/*
